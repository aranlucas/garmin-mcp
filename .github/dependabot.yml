version: 2

# GitHub documents pnpm support only through v10; this workspace uses pnpm 12.
# Keep GitHub Actions updates grouped until Dependabot supports this pnpm version.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "06:00"
      timezone: America/Los_Angeles
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
