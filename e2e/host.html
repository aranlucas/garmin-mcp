<!doctype html>
<html lang="en">
  <head>
    <title>Garmin fixture host</title>
  </head>
  <body>
    <iframe
      title="Garmin app"
      sandbox="allow-scripts allow-same-origin"
      style="width: 100%; height: 900px; border: 0"
    ></iframe>
    <button id="resolve" type="button">Resolve pending replies</button>
    <p>Tool replies handled: <output id="settled">0</output></p>
    <ol id="calls" aria-label="Tool calls"></ol>
    <ol id="context" aria-label="Model context"></ol>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
